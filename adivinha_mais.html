<meta charset="utf-8" />

<input />
<buton>Compare com o meu segredo</buton>

<script>
  var segredos = []; // Array com os números secretos
  function sorteia() {
    // Função para sortear um número secreto
    var numero = Math.round(Math.random() * 10); // Gera um número aleatorio entre 0 e 10
    return numero; // Retorna o número sorteado
  }

  var segredo = Math.round(Math.random() * 10); // Gera um número aleatorio entre 0 e 10

  var input = document.querySelector("input");
  input.focus(); // Foca no campo de entrada quando a página é carregada

  function verifica() {
    var achou = false;

    for (var posicao = 0; posicao < segredos.length; posicao++) {
      if (input.value == segredos[posicao]) {
        // Verifica se o número digitado está no array de segredos
        alert("parabéns voce acertou o número secreto!");
        achou = true; // Marca que o numero foi encontrado
        break; // Sai do loop se o número for encontrado
      } else if (input.value == segredo) {
        // Verifica se o número digitado é o número secreto
        alert("parabéns voce acertou o número secreto!");
      }
    }
    input.value = ""; // Limpa o campo de entrada após a verificação
    input.focus(); // Foca novamente no campo de entrada
  }
</script>
